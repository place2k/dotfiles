# vim: set ft=dosini
# note: configuration names and values are case-sensitive
# if a value starts with `env:`, the name following that will be replaced by the value of the corresponding environment variable, if it is set
# syntax to follow when adding new sections and configurations:
# * section names are lowercase letters between square brackets; names must be concise and cannot contain any number or special character (including space)
# * configuration names are lowercase letters, optionally with a hyphen as separator (in place of space)
# ** like section names, they must not contain any number or special character (other than hyphens); however, they may be as long as needed
# * configuration values are given after the equal sign that separates them from the names; they may consist of any character other than newline and hash sign

[path]
spts-origdir=/usr/local/scripts    # scripts origin directory
spts-bkupdir=/qb/scripts     # scripts backup directory
enum-mapping=/home/paulo/.config/spt.enum # path to the script numbers text-database file

[perms]
# permissions may be given either in octal or in symbolic format (see chmod(1) for more information)
# they refer to file permissions only, not to those of the parent directory
spts-origdir=755
spts-bkupdir=444
enum-mapping=600

[edit]
# either cli (default) or gui
mode=cli
# pattern-matched script file(s) to edit: all, first, or last
selected-match=all
# name of the character to use as word separator in script filenames instead of space: dash (-), underline (_), dot (.), or colon (:)
scriptname-sep=dash
# command line to use on the shebang line automatically inserted in new files
# it consists of an interpreter name, optionally preceded by env (for per-system automatic path resolution), and the interpreter's flags
# the first word here, being the interpreter name, will be expanded onto the shebang as #!$(which <name>)
# if a leading space is present before that word, it will be put after the shebang and before the path, i.e. #! $(which <name>)
# if the value is empty (nothing is given after the equal sign), this feature is disabled and no shebang line will be inserted
autoshebang=bash

[editor]
cli=vim  # default editor
gui=kate # used when the -g flag is passed to `edit`
# format strings that specify how the script path (%s) and line number (%l) arguments should be passed to the CLI/GUI editor
# must contain the %s (scriptname) format specifier, at the very least; %l is optional
# if %l is not used in the format string, the `edit` command's -L (--line) option will not work and will be ignored (`edit` will still work)
# to include a literal percentage sign (%) in the editor's commandline arguments, use %% in the format string
# the %s and %l specifiers should not repeat in the format string: they should be used only once; %% may be used as many times as required
argfmt-cli=%l %s # for Vim: line and script (in this order) as separate arguments
argfmt-gui=%s%l  # for KDE Kate: script and line together as one argument
lnflag-cli=+     # flag character used by the CLI editor for jumping to a given line at startup; leave empty if unsupported
lnflag-gui=:     # flag character used by the GUI editor for the same; leave empty if unsupported
# whether to wait for all of the GUI editor's processes to exit before moving on to the next script
# should be true if its parent process exits immediately after startup (as kate's does)
wait-on-gui=true

[del]
# ignored when all files are to be deleted (confirmation is always requested then)
# values: all (ask for every file), once (ask once before deleting all), no (do not ask for confirmation)
confirm=all

[view]
# what to use by default to view a script's content
# pagedcolor (default): use bat(1) with --style=full --paging=auto, for syntax-highlighting and paging
# paged: use less(1)
# color: use bat(1) with --style=plain --paging=never, for syntax-highlighting without paging and line numbers
# simple: use cat(1)
mode=pagedcolor

[list]
# which scripts directory to list when not told otherwise
# scripts (default): list the original scripts-directory, set in $SCRIPTS_DIR or under the [dirs] section below
# backup: list the backup directory, if one is in use (if it's set in the [dirs] section below)
# both: list both directories
dir=scripts
# how to sort the script files list
# name (default): sort by name (A-Z)
# date-abs: sort by date, showing absolute dates
# date-rel: sort by date, showing relative dates
sort=date-rel

[link]
force=false   # whether to create a script link even if one exists already
symbolic=true # whether to create a symbolic or a hard link
symchain=true # whether creating a "symbolic chain" (i.e. symlinks to symlinks) is allowed
